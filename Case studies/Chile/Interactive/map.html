<!DOCTYPE html>

<head>
<meta charset="utf-8">
<title>Chile Critical Minerals - Heatmap</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: monospace; background: #1a1a1a; color: #ccc; }
  #map { width: 100%; height: 100vh; }
  .controls {
    position: absolute; top: 10px; right: 10px; z-index: 1000;
    background: rgba(20,20,20,0.92); padding: 12px; border-radius: 4px;
    border: 1px solid #444; max-width: 260px; font-size: 12px;
  }
  .controls h3 { color: #e8a735; margin-bottom: 8px; font-size: 13px; }
  .controls label { display: block; margin: 2px 0; cursor: pointer; }
  .controls label:hover { color: #fff; }
  .controls input[type=checkbox] { margin-right: 5px; }
  .controls select { width: 100%; background: #222; color: #ccc; border: 1px solid #555; padding: 4px; margin: 4px 0; }
  .section { margin-top: 10px; border-top: 1px solid #333; padding-top: 8px; }
  .count { color: #e8a735; font-weight: bold; }
  .toggle-btn { 
    background: #333; color: #ccc; border: 1px solid #555; 
    padding: 3px 8px; cursor: pointer; font-size: 11px; margin: 2px;
    font-family: monospace;
  }
  .toggle-btn:hover { background: #555; }
</style>
</head>
<body>

<div id="map"></div>

<div class="controls">
  <h3>CHILE MINERALES CRITICOS</h3>
  <div>Showing: <span class="count" id="countDisplay">267</span> deposits</div>
  
  <div class="section">
    <strong>Primary Mineral</strong><br>
    <button class="toggle-btn" onclick="toggleAll(true)">All</button>
    <button class="toggle-btn" onclick="toggleAll(false)">None</button>
    <div id="mineralFilters"></div>
  </div>
  
  <div class="section">
    <strong>Status</strong>
    <select id="statusFilter" onchange="updateMap()">
      <option value="all">All statuses</option>
    </select>
  </div>

  <div class="section">
    <strong>View</strong><br>
    <label><input type="checkbox" id="showHeat" checked onchange="updateMap()"> Heatmap</label>
    <label><input type="checkbox" id="showMarkers" checked onchange="updateMap()"> Markers</label>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

var MINERAL_COLORS = {
  'Cobre': '#e07020',
  'Oro': '#ffd700',
  'Litio': '#00ccff',
  'Plata': '#c0c0c0',
  'Hierro': '#8b0000',
  'Nitrato': '#90ee90',
  'Boro': '#ff69b4',
  'Manganeso': '#9370db',
  'Cinc': '#20b2aa',
  'Titanio': '#ff4500',
  'Tierras raras': '#ff00ff',
};

var map = L.map('map').setView([-28, -70], 5);

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: 'CartoDB | Sernageomin',
  maxZoom: 18
}).addTo(map);

var heatLayer = null;
var markerLayer = L.layerGroup().addTo(map);
var activeFilters = {};

// Build mineral filter checkboxes
var minerals = [...new Set(DATA.map(d => d.mineral))].filter(Boolean).sort();
var filterDiv = document.getElementById('mineralFilters');
minerals.forEach(function(m) {
  activeFilters[m] = true;
  var label = document.createElement('label');
  var cb = document.createElement('input');
  cb.type = 'checkbox';
  cb.checked = true;
  cb.value = m;
  cb.onchange = function() { activeFilters[m] = this.checked; updateMap(); };
  var span = document.createElement('span');
  span.style.color = MINERAL_COLORS[m] || '#ccc';
  span.textContent = ' ' + m;
  label.appendChild(cb);
  label.appendChild(span);
  filterDiv.appendChild(label);
});

// Build status filter
var statuses = [...new Set(DATA.map(d => d.status))].filter(Boolean).sort();
var statusSelect = document.getElementById('statusFilter');
statuses.forEach(function(s) {
  var opt = document.createElement('option');
  opt.value = s; opt.textContent = s;
  statusSelect.appendChild(opt);
});

function toggleAll(on) {
  minerals.forEach(function(m) { activeFilters[m] = on; });
  var cbs = filterDiv.querySelectorAll('input');
  cbs.forEach(function(cb) { cb.checked = on; });
  updateMap();
}

function getFiltered() {
  var status = document.getElementById('statusFilter').value;
  return DATA.filter(function(d) {
    if (!activeFilters[d.mineral]) return false;
    if (status !== 'all' && d.status !== status) return false;
    return true;
  });
}

function updateMap() {
  var filtered = getFiltered();
  document.getElementById('countDisplay').textContent = filtered.length;
  
  // Heatmap
  if (heatLayer) map.removeLayer(heatLayer);
  if (document.getElementById('showHeat').checked) {
    var heatData = filtered.map(function(d) { return [d.lat, d.lng, 0.7]; });
    heatLayer = L.heatLayer(heatData, {
      radius: 25, blur: 20, maxZoom: 10,
      gradient: {0.2: '#0d0887', 0.4: '#7b2382', 0.6: '#fb9f3a', 0.8: '#fdca26', 1.0: '#f0f921'}
    }).addTo(map);
  }
  
  // Markers
  markerLayer.clearLayers();
  if (document.getElementById('showMarkers').checked) {
    filtered.forEach(function(d) {
      var color = MINERAL_COLORS[d.mineral] || '#999';
      var marker = L.circleMarker([d.lat, d.lng], {
        radius: 5, fillColor: color, color: '#000',
        weight: 1, fillOpacity: 0.8
      });
      marker.bindPopup(
        '<b>' + d.name + '</b><br>' +
        'Minerals: ' + d.combo + '<br>' +
        'Status: ' + d.status + '<br>' +
        'Region: ' + d.region + '<br>' +
        'Model: ' + d.modelo
      );
      markerLayer.addLayer(marker);
    });
  }
}

updateMap();
</script>
